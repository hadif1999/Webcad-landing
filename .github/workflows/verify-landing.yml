name: "Verify Landing"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  verify-landing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      LANDING_SITE_URL: https://webcad.space
      LANDING_DASHBOARD_BASE_URL: https://dashboard.webcad.space
      PRIVATE_CONFIG_TEST: PRIVATE_CONFIG_SENTINEL
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: timeout 400 pnpm install --frozen-lockfile

      - name: Check configuration and lifecycle
        run: |
          timeout 400 pnpm check
          timeout 400 scripts/dev-scripts.selfcheck.sh
      - name: Lint
        run: timeout 400 pnpm lint
      - name: Type check
        run: timeout 400 pnpm typecheck
      - name: Export and verify static pages
        run: |
          timeout 400 pnpm build
          timeout 400 pnpm check:export
