server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Keep directory redirects relative behind the HTTPS gateway.
    absolute_redirect off;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /healthz { access_log off; return 200 "OK\n"; }
    location = /sw.js { add_header Cache-Control "no-store, no-cache, must-revalidate" always; try_files $uri =404; }
    location = /registerSW.js { add_header Cache-Control "no-store, no-cache, must-revalidate" always; try_files $uri =404; }
    location ^~ /_next/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
